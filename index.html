<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swedish Vowel Contrast Trainer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

h2 {
    margin-top: 0;
}

.section {
    max-width: 700px;
    margin: 0 auto 25px;
}

.contrast {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.ipa {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 14px;
}

.words {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 8px;
    background: #e8e8e8;
    padding: 12px 18px;
    font-size: 19px;
    cursor: pointer;
}

button:hover {
    background: #d8d8d8;
}

button:active {
    transform: scale(0.97);
}

.play-all {
    width: 100%;
    margin-top: 14px;
    background: #222;
    color: white;
    font-size: 17px;
}

.quiz {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.quiz-question {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 18px;
}

.quiz-play {
    width: 100%;
    margin-bottom: 18px;
    background: #e8e8e8;
}

.quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.quiz-option {
    font-size: 22px;
    padding: 16px;
}

.quiz-option.correct {
    background: #b9e6b9;
}

.quiz-option.wrong {
    background: #f0b9b9;
}

.quiz-result {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    min-height: 25px;
}

.next-button {
    width: 100%;
    margin-top: 15px;
    background: #222;
    color: white;
    display: none;
}

.score {
    text-align: center;
    margin-bottom: 15px;
    font-size: 18px;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .quiz-options {
        grid-template-columns: 1fr;
    }

    button {
        flex: 1;
    }
}
</style>
</head>

<body>

<h1>Swedish Vowel Contrast Trainer</h1>

<div class="section">
    <h2>Listen</h2>
    <div id="contrasts"></div>
</div>

<div class="section">
    <h2>Quiz</h2>

    <div class="quiz">
        <div class="score" id="score">Score: 0 / 0</div>

        <div class="quiz-question" id="quizQuestion">
            Listen and choose the word you hear.
        </div>

        <button class="quiz-play" id="quizPlay">
            Play
        </button>

        <div class="quiz-options" id="quizOptions"></div>

        <div class="quiz-result" id="quizResult"></div>

        <button class="next-button" id="nextButton">
            Next
        </button>
    </div>
</div>

<script>
const contrasts = [
    {
        ipa: "/oː/, /ɑː/",
        words: ["mås", "mas", "sal", "sål"]
    },
    {
        ipa: "/eː/, /iː/",
        words: ["men", "min", "fel", "fil", "vet", "vit"]
    },
    {
        ipa: "/øː/, /uː/",
        words: ["nöt", "not", "röt", "rot"]
    },
    {
        ipa: "/ɵ/, /ʊ/",
        words: ["full", "bott"]
    },
    {
        ipa: "/ʏ/, /ɵ/",
        words: ["lycka", "lucka", "syll", "full"]
    },
    {
        ipa: "/yː/, /uː/",
        words: ["byta", "bota", "syl", "sol"]
    },
    {
        ipa: "/øː/, /ʉː/",
        words: ["mös", "mus"]
    }
];

let voices = [];
let score = 0;
let total = 0;
let currentQuestion = null;
let answered = false;

function loadVoices() {
    voices = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function getSwedishVoice() {
    return voices.find(v => v.lang.toLowerCase() === "sv-se") ||
           voices.find(v => v.lang.toLowerCase().startsWith("sv"));
}

function speak(word) {
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = "sv-SE";
    utterance.rate = 0.8;
    utterance.pitch = 1;

    const voice = getSwedishVoice();

    if (voice) {
        utterance.voice = voice;
    }

    speechSynthesis.speak(utterance);
}

function playAll(words) {
    speechSynthesis.cancel();

    const voice = getSwedishVoice();

    words.forEach((word, index) => {
        setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(word);

            utterance.lang = "sv-SE";
            utterance.rate = 0.75;
            utterance.pitch = 1;

            if (voice) {
                utterance.voice = voice;
            }

            speechSynthesis.speak(utterance);
        }, index * 1300);
    });
}

function createContrast(item) {
    const container = document.createElement("div");
    container.className = "contrast";

    const ipa = document.createElement("div");
    ipa.className = "ipa";
    ipa.textContent = item.ipa;

    const words = document.createElement("div");
    words.className = "words";

    item.words.forEach(word => {
        const button = document.createElement("button");
        button.textContent = word;
        button.onclick = () => speak(word);
        words.appendChild(button);
    });

    const playAllButton = document.createElement("button");
    playAllButton.className = "play-all";
    playAllButton.textContent = "Play all";
    playAllButton.onclick = () => playAll(item.words);

    container.appendChild(ipa);
    container.appendChild(words);
    container.appendChild(playAllButton);

    return container;
}

contrasts.forEach(item => {
    document
        .getElementById("contrasts")
        .appendChild(createContrast(item));
});

function getAllWords() {
    return contrasts.flatMap(item => item.words);
}

function getRandomQuestion() {
    const allWords = getAllWords();
    const answer = allWords[Math.floor(Math.random() * allWords.length)];

    const contrast = contrasts.find(item =>
        item.words.includes(answer)
    );

    const otherWords = contrast.words
        .filter(word => word !== answer);

    const wrong = otherWords[
        Math.floor(Math.random() * otherWords.length)
    ];

    return {
        answer: answer,
        options: [answer, wrong]
    };
}

function startQuiz() {
    currentQuestion = getRandomQuestion();
    answered = false;

    document.getElementById("quizResult").textContent = "";
    document.getElementById("nextButton").style.display = "none";

    const options = document.getElementById("quizOptions");
    options.innerHTML = "";

    currentQuestion.options
        .sort(() => Math.random() - 0.5)
        .forEach(word => {
            const button = document.createElement("button");

            button.className = "quiz-option";
            button.textContent = word;

            button.onclick = () => answerQuiz(button, word);

            options.appendChild(button);
        });

    document.getElementById("quizPlay").onclick = () => {
        speak(currentQuestion.answer);
    };

    speak(currentQuestion.answer);
}

function answerQuiz(button, word) {
    if (answered) return;

    answered = true;
    total++;

    const buttons = document.querySelectorAll(".quiz-option");

    buttons.forEach(btn => {
        btn.disabled = true;

        if (btn.textContent === currentQuestion.answer) {
            btn.classList.add("correct");
        }
    });

    if (word === currentQuestion.answer) {
        score++;
        document.getElementById("quizResult").textContent = "Correct";
    } else {
        button.classList.add("wrong");
        document.getElementById("quizResult").textContent =
            "Answer: " + currentQuestion.answer;
    }

    document.getElementById("score").textContent =
        "Score: " + score + " / " + total;

    document.getElementById("nextButton").style.display = "block";
}

document.getElementById("nextButton").onclick = startQuiz;

startQuiz();
</script>

</body>
</html>
