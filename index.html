<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swedish Vowel Contrast Trainer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

h1, h2 {
    text-align: center;
}

.section {
    max-width: 750px;
    margin: 0 auto 30px;
}

.contrast {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.ipa {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 14px;
}

.pair {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

button {
    border: none;
    border-radius: 8px;
    background: #e8e8e8;
    padding: 12px 18px;
    font-size: 19px;
    cursor: pointer;
}

button:hover {
    background: #d8d8d8;
}

button:active {
    transform: scale(0.97);
}

.play-all {
    width: 100%;
    background: #222;
    color: white;
}

.quiz {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.score {
    text-align: center;
    font-size: 18px;
    margin-bottom: 18px;
}

.quiz-info {
    text-align: center;
    font-size: 18px;
    margin-bottom: 15px;
}

.quiz-play {
    width: 100%;
    margin-bottom: 18px;
}

.quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.quiz-option {
    font-size: 22px;
    padding: 18px;
}

.quiz-option.correct {
    background: #b9e6b9;
}

.quiz-option.wrong {
    background: #f0b9b9;
}

.quiz-result {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-top: 15px;
    min-height: 25px;
}

.next-button {
    width: 100%;
    margin-top: 15px;
    background: #222;
    color: white;
    display: none;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .quiz-options {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>Swedish Vowel Contrast Trainer</h1>

<div class="section">
    <h2>Listen</h2>
    <div id="contrasts"></div>
</div>

<div class="section">
    <h2>Quiz</h2>

    <div class="quiz">
        <div class="score" id="score">Score: 0 / 0</div>

        <div class="quiz-info" id="quizInfo">
            Listen and choose which word you hear.
        </div>

        <button class="quiz-play" id="quizPlay">
            Play
        </button>

        <div class="quiz-options" id="quizOptions"></div>

        <div class="quiz-result" id="quizResult"></div>

        <button class="next-button" id="nextButton">
            Next
        </button>
    </div>
</div>

<script>
const contrasts = [
    {
        ipa: "/oː/, /ɑː/",
        pairs: [
            ["mås", "mas"],
            ["sal", "sål"]
        ]
    },
    {
        ipa: "/eː/, /iː/",
        pairs: [
            ["men", "min"],
            ["fel", "fil"],
            ["vet", "vit"]
        ]
    },
    {
        ipa: "/øː/, /uː/",
        pairs: [
            ["nöt", "not"],
            ["röt", "rot"]
        ]
    },
    {
        ipa: "/ɵ/, /ʊ/",
        pairs: [
            ["full", "bott"]
        ]
    },
    {
        ipa: "/ʏ/, /ɵ/",
        pairs: [
            ["lycka", "lucka"],
            ["syll", "full"]
        ]
    },
    {
        ipa: "/yː/, /uː/",
        pairs: [
            ["byta", "bota"],
            ["syl", "sol"]
        ]
    },
    {
        ipa: "/øː/, /ʉː/",
        pairs: [
            ["mös", "mus"]
        ]
    }
];

let voices = [];
let score = 0;
let total = 0;
let currentPair = null;
let currentAnswer = null;
let answered = false;

function loadVoices() {
    voices = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function getSwedishVoice() {
    return voices.find(v =>
        v.lang.toLowerCase() === "sv-se"
    ) || voices.find(v =>
        v.lang.toLowerCase().startsWith("sv")
    );
}

function speak(word) {
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(word);

    utterance.lang = "sv-SE";
    utterance.rate = 0.8;
    utterance.pitch = 1;

    const voice = getSwedishVoice();

    if (voice) {
        utterance.voice = voice;
    }

    speechSynthesis.speak(utterance);
}

function playPair(pair) {
    speechSynthesis.cancel();

    const voice = getSwedishVoice();

    pair.forEach((word, index) => {
        setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(word);

            utterance.lang = "sv-SE";
            utterance.rate = 0.8;
            utterance.pitch = 1;

            if (voice) {
                utterance.voice = voice;
            }

            speechSynthesis.speak(utterance);
        }, index * 1300);
    });
}

function createContrast(item) {
    const container = document.createElement("div");
    container.className = "contrast";

    const ipa = document.createElement("div");
    ipa.className = "ipa";
    ipa.textContent = item.ipa;

    container.appendChild(ipa);

    item.pairs.forEach(pair => {
        const pairContainer = document.createElement("div");
        pairContainer.className = "pair";

        pair.forEach(word => {
            const button = document.createElement("button");
            button.textContent = word;
            button.onclick = () => speak(word);
            pairContainer.appendChild(button);
        });

        const pairButton = document.createElement("button");
        pairButton.textContent = "Play pair";
        pairButton.onclick = () => playPair(pair);

        pairContainer.appendChild(pairButton);
        container.appendChild(pairContainer);
    });

    return container;
}

contrasts.forEach(item => {
    document
        .getElementById("contrasts")
        .appendChild(createContrast(item));
});

function getAllPairs() {
    const result = [];

    contrasts.forEach(contrast => {
        contrast.pairs.forEach(pair => {
            result.push({
                ipa: contrast.ipa,
                pair: pair
            });
        });
    });

    return result;
}

function createQuizQuestion() {
    const pairs = getAllPairs();

    const selected =
        pairs[Math.floor(Math.random() * pairs.length)];

    currentPair = selected.pair;

    currentAnswer =
        currentPair[Math.floor(Math.random() * 2)];

    answered = false;

    document.getElementById("quizResult").textContent = "";
    document.getElementById("nextButton").style.display = "none";

    document.getElementById("quizInfo").textContent =
        selected.ipa + " — Which word did you hear?";

    const options = document.getElementById("quizOptions");
    options.innerHTML = "";

    const shuffled = [...currentPair]
        .sort(() => Math.random() - 0.5);

    shuffled.forEach(word => {
        const button = document.createElement("button");

        button.className = "quiz-option";
        button.textContent = word;

        button.onclick = () => answerQuiz(button, word);

        options.appendChild(button);
    });

    document.getElementById("quizPlay").onclick = () => {
        speak(currentAnswer);
    };

    speak(currentAnswer);
}

function answerQuiz(button, word) {
    if (answered) return;

    answered = true;
    total++;

    const buttons =
        document.querySelectorAll(".quiz-option");

    buttons.forEach(btn => {
        btn.disabled = true;

        if (btn.textContent === currentAnswer) {
            btn.classList.add("correct");
        }
    });

    if (word === currentAnswer) {
        score++;
        document.getElementById("quizResult").textContent =
            "Correct";
    } else {
        button.classList.add("wrong");

        document.getElementById("quizResult").textContent =
            "Answer: " + currentAnswer;
    }

    document.getElementById("score").textContent =
        "Score: " + score + " / " + total;

    document.getElementById("nextButton").style.display =
        "block";
}

document.getElementById("nextButton").onclick =
    createQuizQuestion;

createQuizQuestion();
</script>

</body>
</html>
