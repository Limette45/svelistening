<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swedish Vowel Contrast Trainer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    .contrast {
        background: white;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .ipa {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 14px;
    }

    .words {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        border-radius: 8px;
        background: #e8e8e8;
        padding: 12px 18px;
        font-size: 20px;
        cursor: pointer;
        min-width: 90px;
    }

    button:hover {
        background: #d8d8d8;
    }

    button:active {
        transform: scale(0.97);
    }

    .play-all {
        width: 100%;
        margin-top: 14px;
        background: #222;
        color: white;
        font-size: 17px;
    }

    .play-all:hover {
        background: #444;
    }

    .empty {
        color: #777;
        font-size: 18px;
    }

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }

        .contrast {
            padding: 15px;
        }

        button {
            flex: 1;
        }
    }
</style>
</head>

<body>

<h1>Swedish Vowel Contrast Trainer</h1>

<div id="app"></div>

<script>
const contrasts = [
    {
        ipa: "/oː/, /ɑː/",
        words: ["mås", "mas", "sal", "sål"]
    },
    {
        ipa: "/eː/, /iː/",
        words: ["men", "min", "fel", "fil", "vet", "vit"]
    },
    {
        ipa: "/øː/, /uː/",
        words: ["nöt", "not", "röt", "rot"]
    },
    {
        ipa: "/ɵ/, /ʊ/",
        words: ["full", "bott"]
    },
    {
        ipa: "/ʏ/, /ɵ/",
        words: ["lycka", "lucka", "syll", "full"]
    },
    {
        ipa: "/yː/, /uː/",
        words: ["byta", "bota", "syl", "sol"]
    },
    {
        ipa: "/øː/, /ʉː/",
        words: ["mös", "mus"]
    }
];

let voices = [];

function loadVoices() {
    voices = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function getSwedishVoice() {
    return voices.find(v => v.lang.toLowerCase() === "sv-se") ||
           voices.find(v => v.lang.toLowerCase().startsWith("sv"));
}

function speak(word) {
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = "sv-SE";
    utterance.rate = 0.8;
    utterance.pitch = 1;

    const voice = getSwedishVoice();

    if (voice) {
        utterance.voice = voice;
    }

    speechSynthesis.speak(utterance);
}

function playAll(words) {
    speechSynthesis.cancel();

    const voice = getSwedishVoice();

    words.forEach((word, index) => {
        const utterance = new SpeechSynthesisUtterance(word);

        utterance.lang = "sv-SE";
        utterance.rate = 0.75;
        utterance.pitch = 1;

        if (voice) {
            utterance.voice = voice;
        }

        utterance.onstart = () => {};

        setTimeout(() => {
            speechSynthesis.speak(utterance);
        }, index * 1300);
    });
}

function createContrast(item) {
    const container = document.createElement("div");
    container.className = "contrast";

    const ipa = document.createElement("div");
    ipa.className = "ipa";
    ipa.textContent = item.ipa;

    const words = document.createElement("div");
    words.className = "words";

    item.words.forEach(word => {
        const button = document.createElement("button");
        button.textContent = word;
        button.onclick = () => speak(word);
        words.appendChild(button);
    });

    const playAllButton = document.createElement("button");
    playAllButton.className = "play-all";
    playAllButton.textContent = "Play all";
    playAllButton.onclick = () => playAll(item.words);

    container.appendChild(ipa);
    container.appendChild(words);
    container.appendChild(playAllButton);

    return container;
}

const app = document.getElementById("app");

contrasts.forEach(item => {
    app.appendChild(createContrast(item));
});
</script>

</body>
</html>
